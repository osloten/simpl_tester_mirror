name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pack source
        run: |
          mkdir -p dist
          tar --exclude='.git' --exclude='.forgejo' --exclude='dist' \
            -czf "dist/source-${{ forge.ref_name }}.tar.gz" .
          # При желании — сразу и zip
          zip -rq "dist/source-${{ forge.ref_name }}.zip" . \
            -x '.git/*' '.forgejo/*' 'dist/*'

      - uses: https://data.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          url: https://codeberg.org
          repo: ${{ forge.repository }}
          tag: ${{ forge.ref_name }}
          token: ${{ secrets.MY_RUNNER }}
          release-dir: dist
